$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
import:
- https://cdn.jsdelivr.net/npm/@cspell/dict-en-gb/cspell-ext.json
allowCompoundWords: true
useGitignore: true
dictionaryDefinitions:
  - name: customwords
    path: cspell/customwords.txt
  - name: agent-mutable
    path: cspell/agent-mutable.txt
    description: |
      A custom dictionary managed by an AI agent.
      This is the only dictionary the agent may edit; users are not expected to edit it directly.
    addWords: false
    noSuggest: true
words: []
dictionaries:
  - agent-mutable
  - customwords
  - en_US
  - en-gb
  - python
  - python-common
  - powershell
  - bash
  - shellscript
  - win32
ignorePaths:
  - "*.toml"
  - .pre-commit-config.yaml
  - "*.code-workspace"
  - "*.ui"
  - "*.svg"
